services:
  app:
    build:
      context: .
      target: runner
      args:
        SITE_ENV: ${SITE_ENV:-staging}
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://luatgiatri.com}
    env_file: .env
    environment:
      # PAYLOAD_SECRET is deliberately NOT set here — it comes from env_file
      # so an unset secret stays unset and the container crash-loops loudly.
      DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./data/media:/app/data/media
    networks:
      - proxy
      - luatgiatri_internal
    labels:
      com.elitara.project: "luatgiatri-website"
      com.elitara.role: "web"
    restart: unless-stopped
    # Docker Desktop defaults StopTimeout to 1 s; a plain `docker stop`
    # would SIGKILL a container still serving a response.
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy

  # One-shot migrations: the runner image has no migrations or payload CLI
  # (standalone output does not trace src/migrations/), so run
  # `pnpm payload migrate` from the builder stage. Never starts with a
  # plain `docker compose up` — invoke with:
  #   docker compose -f docker-compose.vps.yml --profile migrate up migrate
  migrate:
    build:
      context: .
      # builder has the full node_modules + payload CLI
      target: builder
    command: sh -c "pnpm payload migrate"
    env_file: .env
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - luatgiatri_internal
    stop_grace_period: 60s
    profiles: ["migrate"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    # Postgres is NEVER attached to the proxy network — only the app is.
    networks:
      - luatgiatri_internal
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  proxy:
    external: true
  luatgiatri_internal:
    name: luatgiatri_internal